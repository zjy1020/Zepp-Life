name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r static www/
          cp -r tutorial www/

      - name: Install ImageMagick
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick

      - name: Init Capacitor Android
        run: npx cap add android

      - name: Install StepWong local plugin
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/zepplife/steps
          cp stepwong-plugin/StepWongPlugin.java android/app/src/main/java/com/zepplife/steps/
          mkdir -p android/app/src/main/assets
          cp stepwong-plugin/data_json.tpl android/app/src/main/assets/data_json.tpl
          MAIN="android/app/src/main/java/com/zepplife/steps/MainActivity.java"
          echo 'package com.zepplife.steps;' > "$MAIN"
          echo '' >> "$MAIN"
          echo 'import android.os.Bundle;' >> "$MAIN"
          echo 'import com.getcapacitor.BridgeActivity;' >> "$MAIN"
          echo '' >> "$MAIN"
          echo 'public class MainActivity extends BridgeActivity {' >> "$MAIN"
          echo '    @Override' >> "$MAIN"
          echo '    public void onCreate(Bundle savedInstanceState) {' >> "$MAIN"
          echo '        registerPlugin(StepWongPlugin.class);' >> "$MAIN"
          echo '        super.onCreate(savedInstanceState);' >> "$MAIN"
          echo '    }' >> "$MAIN"
          echo '}' >> "$MAIN"

      - name: Generate app icons
        run: |
          # 1. Generate mipmap densities — icon.png fills each size directly
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            res="${pair%%:*}"
            size="${pair##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${res}"
            convert icon.png -resize ${size}x${size}^ -gravity center -extent ${size}x${size} \
              "android/app/src/main/res/mipmap-${res}/ic_launcher.png"
            # Same for round icon
            cp "android/app/src/main/res/mipmap-${res}/ic_launcher.png" \
               "android/app/src/main/res/mipmap-${res}/ic_launcher_round.png"
          done

          # 2. Adaptive icon foreground — icon.png fills full viewport
          convert -size 1024x1024 xc:none \
            \( icon.png -resize 1024x1024^ -gravity center -extent 1024x1024 \) \
            -gravity center -composite android-fg.png
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            res="${pair%%:*}"
            size="${pair##*:}"
            convert android-fg.png -resize ${size}x${size} \
              "android/app/src/main/res/mipmap-${res}/ic_launcher_foreground.png"
          done

          # 3. Adaptive icon background — transparent so foreground shows through
          mkdir -p android/app/src/main/res/drawable
          printf '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#00000000"/>\n</shape>\n' > android/app/src/main/res/drawable/ic_launcher_background.xml

          # 4. Adaptive icon XML definition
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@drawable/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Copy icon to web assets
        run: cp icon.png www/

      - name: Sync web assets
        run: npx cap sync

      - name: Sync app version into Android
        run: |
          # 以 static/js/app.js 里的 APP_VERSION 为唯一来源，
          # 避免 App 内显示 1.0.6、系统里却显示 1.0
          VERSION=$(grep -oP "APP_VERSION = '\K[0-9]+\.[0-9]+\.[0-9]+" static/js/app.js | head -1)
          if [ -z "$VERSION" ]; then
            echo "未取到 APP_VERSION，保留默认值"
            exit 0
          fi
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/^\(\s*versionCode \).*/\1$CODE/" android/app/build.gradle
          sed -i "s/^\(\s*versionName \).*/\1\"$VERSION\"/" android/app/build.gradle
          echo "APP_VERSION=$VERSION versionCode=$CODE"
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Restore release keystore
        run: |
          set -e
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 —— 没有它每次构建都会生成新的调试密钥，各版本签名不同、无法覆盖安装"
            exit 1
          fi
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "keystore 已恢复: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"

      - name: Patch Android project
        run: python3 scripts/patch_android.py
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK
        run: cd android && ./gradlew assembleDebug
        env:
          # Gradle 在配置阶段读取这几个变量，所以构建步骤也要带上
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Show signing certificate fingerprint
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 动动吧
          path: android/app/build/outputs/apk/debug/*.apk
